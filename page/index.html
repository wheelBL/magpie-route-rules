<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>路由规则学习</title>
<script src="_magpie/bridge.js"></script>
<script src="app.js" defer></script>
<style>
  :root {
    --fg: var(--magpie-fg, #e5e7eb);
    --bg: var(--magpie-bg, #0d0f13);
    --accent: var(--magpie-accent, #3b82f6);
    --card: color-mix(in srgb, var(--fg) 4%, transparent);
    --border: color-mix(in srgb, var(--fg) 10%, transparent);
    --border-strong: color-mix(in srgb, var(--fg) 18%, transparent);
    --muted: color-mix(in srgb, var(--fg) 55%, transparent);
    --faint: color-mix(in srgb, var(--fg) 32%, transparent);
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
  }
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 24px 28px 48px; max-width: 980px;
    color: var(--fg); font-size: 13px; line-height: 1.55;
  }
  .meta { color: var(--faint); font-size: 11.5px; margin: 0 0 20px; letter-spacing: .02em }

  /* ── 区块标题 ── */
  .sec { margin: 28px 0 12px; display: flex; align-items: baseline; gap: 10px }
  .sec h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
  .sec .sub { font-size: 11px; color: var(--faint) }

  /* ── KPI 卡片网格 ── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px }
  .kpi {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 12px; position: relative; overflow: hidden;
  }
  .kpi::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: .7;
  }
  .kpi .label { font-size: 11px; color: var(--muted); letter-spacing: .05em }
  .kpi .value { font-size: 26px; font-weight: 700; margin: 2px 0 1px; font-variant-numeric: tabular-nums; letter-spacing: -.02em }
  .kpi .value small { font-size: 14px; font-weight: 500; color: var(--muted) }
  .kpi .delta { font-size: 11px; color: var(--faint) }
  .kpi .delta b { color: var(--ok); font-weight: 600 }
  .kpi.good::before { background: var(--ok) }
  .kpi.warn::before { background: var(--warn) }

  /* ── 模型卡片列表 ── */
  .models { display: flex; flex-direction: column; gap: 8px }
  .model {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; display: grid;
    grid-template-columns: 28px minmax(150px, 1.1fr) 1.5fr repeat(4, 58px);
    gap: 8px; align-items: center;
  }
  .model .rank { font-size: 15px; font-weight: 700; color: var(--faint); text-align: center }
  .model.first .rank { color: var(--accent) }
  .model .name { display: flex; flex-direction: column; min-width: 0; gap: 1px }
  .model .name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12.5px }
  .model .name .deg { color: var(--warn); font-size: 10.5px }
  .model .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden }
  .model .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ok))) }
  .model .stat { text-align: right; font-variant-numeric: tabular-nums }
  .model .stat b { display: block; font-size: 13px; font-weight: 600 }
  .model .stat span { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em }
  .model.first { border-color: color-mix(in srgb, var(--accent) 40%, transparent) }

  /* ── 洞察卡 ── */
  .insights { display: flex; flex-direction: column; gap: 8px }
  .insight {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px 9px 14px;
    background: var(--card); position: relative;
  }
  .insight::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px }
  .insight.warn::before { background: var(--warn) }
  .insight.info::before { background: var(--info) }
  .insight.suggest::before { background: #a78bfa }
  .insight .lv { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-right: 8px }
  .insight.warn .lv { color: var(--warn) }
  .insight.info .lv { color: var(--info) }
  .insight.suggest .lv { color: #a78bfa }

  /* ── 能力/动作 行 ── */
  .rows { display: flex; flex-direction: column; gap: 4px }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0 }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px color-mix(in srgb, var(--ok) 50%, transparent) }
  .dot.bad { background: var(--bad) }
  .dot.none { background: var(--faint) }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .row .tag {
    font-size: 10.5px; padding: 1px 8px; border-radius: 10px;
    background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted);
  }
  .row .ago { font-size: 11px; color: var(--faint); white-space: nowrap }

  /* ── AI 反思块 ── */
  .reflect {
    border: 1px solid var(--border); border-radius: 10px; background: var(--card);
    padding: 14px 18px;
  }
  .reflect .head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; color: var(--muted) }
  .reflect pre {
    margin: 0; white-space: pre-wrap; font-size: 12px; line-height: 1.65;
    color: color-mix(in srgb, var(--fg) 88%, transparent);
    border-left: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
    padding-left: 14px;
  }

  .empty { color: var(--faint); font-size: 12px; padding: 8px 0 }

  /* 依据注脚（效果区唯一非卡片元素，跨全列防 grid 挤压） */
  .stat-note { grid-column: 1 / -1; margin-top: 2px; font-size: 11px; color: var(--faint); padding: 0 2px; line-height: 1.55; display: flex; gap: 6px; align-items: baseline }
  .stat-note::before { content: 'ⓘ'; font-size: 10px }
</style>
</head>
<body>
<p class="meta" id="meta">加载中…</p>

<div class="sec"><h2>插件效果</h2><span class="sub" id="impactSub"></span></div>
<div class="kpis" id="impact"><p class="empty">统计中（伴生每小时重算，首轮运行后显示）</p></div>

<div class="sec"><h2>模型优先级</h2><span class="sub">体验评分降序 = 路由优先顺序</span></div>
<div class="models" id="perf"></div>

<div class="sec"><h2>反思洞察</h2><span class="sub">周期自省产出</span></div>
<div class="insights" id="insights"></div>

<div class="sec"><h2>图片能力</h2><span class="sub">探针/负学习标记</span></div>
<div class="rows" id="images"></div>

<div class="sec"><h2>失败处理动作</h2><span class="sub">执行中</span></div>
<div class="rows" id="actions"></div>

<div class="sec"><h2>AI 深度反思</h2><span class="sub">每日自动 + 手动 --reflect</span></div>
<div id="reflect"><p class="empty">尚未运行</p></div>
</body>
</html>
